[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "classync-persistence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]==3.3.6", "SQLAlchemy==2.1.6", "alembic==1.20.1", "classync-api-contracts==0.1.0"]

[tool.setuptools.packages.find]
include = ["classync_persistence*"]

[tool.setuptools.package-data]
classync_persistence = ["migrations/*.py", "migrations/versions/*.py"]
